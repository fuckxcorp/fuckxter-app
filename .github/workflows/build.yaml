name: Keep running back , coming back for more

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Morning dew (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get version
        id: get_version
        shell: bash
        run: |
          vercion=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$vercion" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Prepare
        shell: bash
        run: |
          flutter pub get
          if [ "${{ matrix.target }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
          fi
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build!
        shell: bash
        run: |
          mkdir -p release
          case "${{ matrix.target }}" in
            android)
              flutter build apk
              cp build/app/outputs/flutter-apk/app-release.apk release/
              ;;
            linux)
              flutter build linux
              tar -C build/linux/x64/release -czf release/fuckxter-linux-x64.tar.gz bundle
              ;;
            windows)
              flutter build windows
              tar -C build/windows/x64/runner/Release -acf release/fuckxter-windows-x64.zip .
              ;;
            macos)
              flutter build macos
              tar -C build/macos/Build/Products/Release -czf release/fuckxter-macos.tar.gz fuckxter_app.app
              ;;
          esac
          ls -la release

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            # 📝 更新日志
            - 修复和改进。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
