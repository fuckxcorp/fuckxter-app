name: Keep running back , coming back for more

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Morning dew (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Select Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: latest-stable

      - name: Get version
        id: get_version
        shell: bash
        run: |
          source scripts/version.sh
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Prepare
        shell: bash
        run: |
          flutter pub get
          if [ "${{ matrix.target }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev rpm zstd desktop-file-utils
          fi
          dart format --output=none --set-exit-if-changed lib test packages/fx_native_glass/lib
          flutter analyze
          flutter test

      - name: Install Go for Linux packaging
        if: matrix.target == 'linux'
        uses: actions/setup-go@main
        with:
          go-version: stable
          cache: false

      - name: Install nFPM
        if: matrix.target == 'linux'
        shell: bash
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Configure Android signing
        if: matrix.target == 'android' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-signing.sh

      - name: Build!
        shell: bash
        run: |
          source scripts/version.sh
          mkdir -p release
          case "${{ matrix.target }}" in
            android)
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
                flutter build apk --debug
                exit 0
              fi
              flutter build apk --release
              "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
              cp build/app/outputs/flutter-apk/app-release.apk "release/fuckxter-${APP_VERSION}-${APP_BUILD}-android.apk"
              ;;
            linux)
              flutter build linux
              desktop-file-validate packaging/linux/fuckxter.desktop
              bash scripts/package-linux.sh
              ;;
            windows)
              flutter build windows
              tar -C build/windows/x64/runner/Release -acf "release/fuckxter-${APP_VERSION}-${APP_BUILD}-windows-x64.zip" .
              ;;
            ios)
              flutter build ios --simulator --debug
              tar -C build/ios/iphonesimulator -czf "release/fuckxter-${APP_VERSION}-${APP_BUILD}-ios-simulator.tar.gz" Runner.app
              ;;
            macos)
              flutter build macos
              bash scripts/package-macos.sh
              ;;
          esac
          ls -la release

      - name: Upload build artifacts
        if: matrix.target == 'ios' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-build
          path: |
            release/*
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Clean Android signing files
        if: always() && matrix.target == 'android'
        shell: bash
        run: rm -f android/release.jks android/key.properties

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.target != 'ios'
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
          body: 修复和改进。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
