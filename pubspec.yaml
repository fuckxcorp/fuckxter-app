name: FuckXter
description: FuckXter Application based on Flutter
publish_to: none
version: 0.1.5+15

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fx_native_glass:
    path: packages/fx_native_glass
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
