name: Keep running back , coming back for more

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Morning dew (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get version
        id: get_version
        shell: bash
        run: |
          source scripts/version.sh
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Prepare
        shell: bash
        run: |
          flutter pub get
          if [ "${{ matrix.target }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev rpm zstd desktop-file-utils
          fi
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Install Go for Linux packaging
        if: matrix.target == 'linux'
        uses: actions/setup-go@main
        with:
          go-version: stable
          cache: false

      - name: Install nFPM
        if: matrix.target == 'linux'
        shell: bash
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build!
        shell: bash
        run: |
          source scripts/version.sh
          mkdir -p release
          case "${{ matrix.target }}" in
            android)
              flutter build apk
              cp build/app/outputs/flutter-apk/app-release.apk "release/fuckxter-${APP_VERSION}-${APP_BUILD}-android.apk"
              ;;
            linux)
              flutter build linux
              desktop-file-validate packaging/linux/fuckxter.desktop
              bash scripts/package-linux.sh
              ;;
            windows)
              flutter build windows
              tar -C build/windows/x64/runner/Release -acf "release/fuckxter-${APP_VERSION}-${APP_BUILD}-windows-x64.zip" .
              ;;
            macos)
              flutter build macos
              bash scripts/package-macos.sh
              ;;
          esac
          ls -la release

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            # 📝 更新日志
            - 版本来源：pubspec.yaml（${{ steps.get_version.outputs.version }}+${{ steps.get_version.outputs.build }}）。
            - Linux：pacman / dpkg / RPM 安装包、AppImage；macOS：DMG；Android：APK；Windows：ZIP。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
