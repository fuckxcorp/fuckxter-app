name: I don't care if Monday's blue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Friday I'm in love
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get version
        id: get_version
        shell: bash
        run: |
          vercion=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$vercion" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Prepare
        shell: bash
        run: |
          flutter pub get
          plugin_dir="$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'flutter_avif_android-*' | head -n 1)"
          test -n "$plugin_dir"
          find "$plugin_dir/android/src/main/java" \
            -name 'FlutterAvifPlugin.java' \
            -delete
          sed -i 's/compileSdkVersion 31/compileSdkVersion 36/' "$plugin_dir/android/build.gradle"
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$plugin_dir/android/build.gradle"
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze

      - name: Build!
        shell: bash
        run: |
          flutter build apk
          ls

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          body: |
            # 📝 更新日志
            - 修复和改进。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
