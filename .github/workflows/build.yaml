name: I don't care if Monday's blue

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Friday I'm in love
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch flutter_avif Android plugin
        run: |
          plugin_dir="$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'flutter_avif_android-*' | head -n 1)"
          test -n "$plugin_dir"
          find "$plugin_dir/android/src/main/java" \
            -name 'FlutterAvifPlugin.java' \
            -delete
          sed -i 's/compileSdkVersion 31/compileSdkVersion 36/' "$plugin_dir/android/build.gradle"
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$plugin_dir/android/build.gradle"

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build apk --debug
